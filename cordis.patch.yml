# dsh-live2d-pets bundle patch: inserts the plugin row into the web roster.
# 安装：`dsh plugin --profile web add dsh-live2d-pets`（官方 publish.md 流程）
# config 作为 settings namespace 的 base 层（schema 默认 → base → 用户层），
# 用户可在「桌宠配置」设置面板覆盖；model 存预设 id（presets.json）或自定义 id。
- insert:
    - id: live2d-pet
      name: dsh-live2d-pets
      config:
        model: hiyori
        debug: false
